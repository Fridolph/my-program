name: Deploy VitePress site to Pages

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/static.yml'
      - 'docs-site/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'public/**'
      - 'views/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docs site
        run: pnpm docs:check
        env:
          NODE_ENV: production

      - name: Sync static resources to build output
        run: node scripts/sync-docs-static.mjs

      - name: Verify required release artifacts
        run: |
          test -f docs-site/.vitepress/dist/index.html
          test -f docs-site/.vitepress/dist/sitemap.xml
          test -f docs-site/.vitepress/dist/robots.txt
          test -f docs-site/.vitepress/dist/manifest.webmanifest
          test -f docs-site/.vitepress/dist/animation-js/loading-love/index.html
          test -f docs-site/.vitepress/dist/release-manifest.json
          test -f docs-site/.vitepress/dist/views/index.html

      - name: Print release snapshot
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('docs-site/.vitepress/dist/release-manifest.json', 'utf8'))
          console.log('Release snapshot:')
          console.log(`- generatedAt: ${manifest.generatedAt}`)
          console.log(`- demos: ${manifest.snapshot.demos}`)
          console.log(`- categories: ${manifest.snapshot.categories}`)
          console.log(`- routes: ${manifest.snapshot.routes}`)
          console.log(`- journalEntries: ${manifest.snapshot.journalEntries}`)
          console.log(`- pageOgImages: ${manifest.snapshot.pageOgImages}`)
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
