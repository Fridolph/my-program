<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>旧入口已迁移到 VitePress 展示站</title>
    <meta name="description" content="my-program 旧首页入口说明页，默认入口已迁移到新的 VitePress 展示站。" />
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://fridolph.github.io/my-program/" />
    <meta http-equiv="refresh" content="1;url=../" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #e0f2fe 0%, #f8fafc 45%, #e2e8f0 100%);
        color: #0f172a;
      }
      .panel {
        width: min(680px, 100%);
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(8px);
      }
      .eyebrow {
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      h1 {
        margin: 16px 0 12px;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.1;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.7;
        color: #334155;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }
      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 168px;
        padding: 12px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
      }
      .primary {
        background: #0f172a;
        color: #fff;
      }
      .secondary {
        border: 1px solid #cbd5e1;
        color: #0f172a;
        background: #fff;
      }
      .hint {
        margin-top: 18px;
        font-size: 14px;
        color: #64748b;
      }
    </style>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        window.setTimeout(() => {
          window.location.replace('../')
        }, 400)
      })
    </script>
  </head>
  <body>
    <main class="panel">
      <span class="eyebrow">Legacy Entry</span>
      <h1>旧首页入口已迁移到 VitePress 展示站</h1>
      <p><code>views/index.html</code> 不再作为仓库默认入口。</p>
      <p>当前默认入口已经迁移到新的文档站，你将自动跳转到新的首页。如果你是从旧链接进入，也可以手动点击下面的入口继续浏览。</p>
      <div class="actions">
        <a class="primary" href="../">进入当前展示站</a>
        <a class="secondary" href="../guide/deployment.html">查看发布说明</a>
        <a class="secondary" href="../public/">查看原始 demo 资源目录</a>
      </div>
      <p class="hint">如果没有自动跳转，请手动点击“进入当前展示站”。如果你是维护者，也可以从“查看发布说明”回看当前发布链路。</p>
    </main>
  </body>
</html>
